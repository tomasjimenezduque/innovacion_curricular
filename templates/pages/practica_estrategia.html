{% extends "layout/base.html" %}

{% block contenido %}
<div class="card shadow mb-4">
    <div class="card-header py-3 d-flex justify-content-between align-items-center">
        <h6 class="m-0 font-weight-bold text-primary">Gestión de Prácticas Estratégicas</h6>
        <a href="{{ url_for('practica_estrategia.crear') }}" class="btn btn-primary btn-sm">+ Nueva Práctica</a>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Tipo</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in practicas %}
                    <tr>
                        <td>{{ p.id }}</td>
                        <td><span class="badge badge-primary">{{ p.tipo }}</span></td>
                        <td><strong>{{ p.nombre }}</strong></td>
                        <td>{{ p.descripcion }}</td>
                        <td>
                            <button class="btn btn-outline-secondary btn-sm">Editar</button>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="5" class="text-center">No hay prácticas registradas</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
