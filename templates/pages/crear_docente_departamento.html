{% extends "layout/base.html" %}

{% block contenido %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Asignar Docente a Programa</h6>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>ID Docente (Cédula/Código)</label>
                    <input type="number" name="docente" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Programa Académico</label>
                    <select name="departamento" class="form-control" required>
                        {% for p in programas %}
                        <option value="{{ p.id }}">{{ p.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Dedicación</label>
                    <select name="dedicacion" class="form-control" required>
                        <option value="Tiempo Completo">Tiempo Completo</option>
                        <option value="Medio Tiempo">Medio Tiempo</option>
                        <option value="Cátedra">Cátedra</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Modalidad</label>
                    <input type="text" name="modalidad" class="form-control" placeholder="Ej: Presencial" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Fecha de Ingreso</label>
                    <input type="date" name="fecha_ingreso" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Fecha de Salida (Opcional)</label>
                    <input type="date" name="fecha_salida" class="form-control">
                </div>
            </div>
            <button type="submit" class="btn btn-success">Registrar Asignación</button>
            <a href="{{ url_for('docente_departamento.index') }}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
