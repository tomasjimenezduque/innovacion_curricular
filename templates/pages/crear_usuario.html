{% extends "layout/base.html" %}

{% block titulo %}Nuevo Usuario{% endblock %}

{% block contenido %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Registrar Nuevo Usuario</h6>
    </div>
    <div class="card-body">
        <form action="{{ url_for('usuario.crear') }}" method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Ej: tmontoya" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" name="email" class="form-control" placeholder="usuario@ejemplo.com" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" name="nombre_completo" class="form-control" placeholder="Nombre y Apellidos">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Rol de Usuario (ID)</label>
                    <!-- Agregamos el campo que causaba el error de NoneType -->
                    <select name="rol_id" class="form-control" required>
                        <option value="">Seleccione un rol...</option>
                        {% for r in roles %}
                        <option value="{{ r.id }}">{{ r.nombre }} (ID: {{ r.id }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">Fecha de Registro</label>
                    <!-- Campo de fecha por si quieres controlarlo manualmente -->
                    <input type="date" name="fecha_registro" class="form-control" 
                           value="{{ fecha_actual }}">
                </div>
            </div>

            <div class="form-check form-switch mb-3">
                <input class="form-check-input" type="checkbox" name="activo" id="checkActivo" checked>
                <label class="form-check-label" for="checkActivo">Usuario Activo</label>
            </div>

            <div class="mt-4">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Guardar Usuario
                </button>
                <a href="{{ url_for('usuario.index') }}" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
