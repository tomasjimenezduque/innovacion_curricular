{% extends "layout/base.html" %}

{% block contenido %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Registrar Nueva Facultad</h6>
    </div>
    <div class="card-body">
        <!-- Especificamos la ruta del POST -->
        <form action="{{ url_for('facultad.crear') }}" method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Nombre de la Facultad</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Ej: Facultad de Ingeniería" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Universidad</label>
                    <select name="universidad" class="form-control" required>
                        <option value="">Seleccione una universidad...</option>
                        {% for u in universidades %}
                        <option value="{{ u.id }}">{{ u.nombre }} (ID: {{ u.id }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Tipo de Facultad</label>
                    <!-- Sugerencia: Podrías usar un <select> si solo hay dos tipos -->
                    <select name="tipo" class="form-control" required>
                        <option value="Pública">Pública</option>
                        <option value="Privada">Privada</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Fecha de Fundación</label>
                    <input type="date" name="fecha_fun" class="form-control" required>
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-success">
                    <i class="fas fa-save"></i> Guardar Facultad
                </button>
                <a href="{{ url_for('facultad.index') }}" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
