{% extends "layout/base.html" %}

{% block contenido %}
<div class="card shadow mb-4">
    <div class="card-header py-3 d-flex justify-content-between align-items-center">
        <h6 class="m-0 font-weight-bold text-primary">Catálogo de Enfoques</h6>
        <a href="{{ url_for('enfoque.crear') }}" class="btn btn-primary btn-sm">+ Nuevo Enfoque</a>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Descripción</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for e in enfoques %}
                    <tr>
                        <td>{{ e.id }}</td>
                        <td><strong>{{ e.nombre }}</strong></td>
                        <td>{{ e.descripcion }}</td>
                        <td>
                            <button class="btn btn-outline-secondary btn-sm">Editar</button>
                        </td>
                    </tr>
                    {% else %}
                    <tr><td colspan="4" class="text-center">No hay enfoques registrados</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
