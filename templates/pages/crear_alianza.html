{% extends "layout/base.html" %}

{% block contenido %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Registrar Nueva Alianza</h6>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Seleccionar Aliado</label>
                    <select name="aliado" class="form-control" required>
                        {% for a in aliados %}
                        <option value="{{ a.nit }}">{{ a.razon_social }} ({{ a.nit }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Programa / Departamento</label>
                    <select name="departamento" class="form-control" required>
                        {% for p in programas %}
                        <option value="{{ p.id }}">{{ p.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label>Fecha Inicio</label>
                    <input type="date" name="fecha_inicio" class="form-control" required>
                </div>
                <div class="col-md-4 mb-3">
                    <label>Fecha Fin (Opcional)</label>
                    <input type="date" name="fecha_fin" class="form-control">
                </div>
                <div class="col-md-4 mb-3">
                    <label>ID Docente Encargado</label>
                    <input type="number" name="docente" class="form-control">
                </div>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-primary">Crear Alianza</button>
                <a href="{{ url_for('alianza.index') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
