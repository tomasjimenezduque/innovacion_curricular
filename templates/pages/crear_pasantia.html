{% extends "layout/base.html" %}
{% block contenido %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Registrar Nueva Pasantía</h6>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label>Título de la Pasantía</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Ej: Pasantía de Investigación en IA" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Empresa / Organización</label>
                    <input type="text" name="empresa" class="form-control" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>País</label>
                    <input type="text" name="pais" class="form-control" placeholder="Ej: Colombia, Alemania" required>
                </div>
            </div>
            <div class="row">
                <div class="col-md-12 mb-3">
                    <label>Programa Académico Vinculado</label>
                    <select name="programa" class="form-control" required>
                        <option value="">Seleccione un programa...</option>
                        {% for prog in programas %}
                        <option value="{{ prog.id }}">{{ prog.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label>Descripción Corta</label>
                <textarea name="descripcion" class="form-control" maxlength="45" rows="2" placeholder="Breve resumen (máx 45 car.)" required></textarea>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-success">Guardar Pasantía</button>
                <a href="{{ url_for('pasantia.index') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
