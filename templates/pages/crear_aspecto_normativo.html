{% extends "layout/base.html" %}

{% block contenido %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Registrar Nuevo Aspecto Normativo</h6>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Tipo de Norma</label>
                    <input type="text" name="tipo" class="form-control" placeholder="Ej: Decreto, Ley, Acuerdo" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Fuente</label>
                    <input type="text" name="fuente" class="form-control" placeholder="Ej: Ministerio de Educación" required>
                </div>
            </div>
            <div class="mb-3">
                <label>Descripción</label>
                <textarea name="descripcion" class="form-control" rows="3" required></textarea>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-success">Guardar Normativa</button>
                <a href="{{ url_for('aspecto_normativo.index') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
