{% extends "layout/base.html" %}

{% block contenido %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Registrar Nueva Práctica Estratégica</h6>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Nombre de la Práctica</label>
                    <input type="text" name="nombre" class="form-control" placeholder="Ej: Aprendizaje Activo" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label>Tipo de Estrategia</label>
                    <select name="tipo" class="form-control" required>
                        <option value="Pedagógica">Pedagógica</option>
                        <option value="Administrativa">Administrativa</option>
                        <option value="Investigativa">Investigativa</option>
                        <option value="Vinculación">Vinculación</option>
                    </select>
                </div>
            </div>
            <div class="mb-3">
                <label>Descripción (Máx. 45 caracteres)</label>
                <textarea name="descripcion" class="form-control" rows="2" maxlength="45" required></textarea>
                <small class="form-text text-muted">Asegúrate de no exceder el límite de la base de datos.</small>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-success">Guardar Registro</button>
                <a href="{{ url_for('practica_estrategia.index') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
