{% extends "layout/base.html" %}

{% block contenido %}
<div class="card shadow mb-4">
    <div class="card-header py-3">
        <h6 class="m-0 font-weight-bold text-primary">Registrar Nuevo Enfoque</h6>
    </div>
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label>Nombre del Enfoque</label>
                <input type="text" name="nombre" class="form-control" placeholder="Ej: Investigativo, Social, Técnico" required>
            </div>
            <div class="mb-3">
                <label>Descripción</label>
                <textarea name="descripcion" class="form-control" rows="3" required></textarea>
            </div>
            <div class="mt-3">
                <button type="submit" class="btn btn-success">Guardar Enfoque</button>
                <a href="{{ url_for('enfoque.index') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
